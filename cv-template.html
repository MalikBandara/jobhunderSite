
<html>

<head>
    <meta charset="UTF-8"></meta>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"></meta>
    <title>Job Wave Blog</title>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></link>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0066cc;
            --text-color: #2d3436;
            --text-muted: #636e72;
            --border-color: #dfe6e9;
            --card-bg: #ffffff;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .blog-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0px;
        }

        /* Blog Header */
        .blog-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .blog-header h1 {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .blog-header p {
            font-size: 18px;
            color: var(--text-muted);
        }

        /* Main Layout */
        .blog-layout {
            width: 100%;
        }

        /* Blog Grid */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* Blog Card */
        .blog-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .blog-card-image {
            width: 100%;
            height: 180px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .blog-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .blog-card-image i {
            font-size: 48px;
            color: #adb5bd;
        }

        .blog-card-content {
            padding: 20px;
        }

        .blog-card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-card-excerpt {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .read-more-btn {
            background: var(--primary-color);
            color: white;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .read-more-btn:hover {
            background: #0052a3;
        }
      
        .atag {
            text-decoration: none;  /* Removes the underline */
            color: inherit;         /* Makes the link use the button's text color */
            outline: none;          /* Removes the dotted border when clicked */
        }

        /* Responsive */
        /* Large Desktop - 4 columns */
        @media (max-width: 1400px) {
            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
        }

        /* Desktop - 3 columns */
        @media (max-width: 1200px) {
            .blog-container {
                padding: 30px 20px;
            }

            .blog-header h1 {
                font-size: 36px;
            }

            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
        }

        /* Tablet - 2 columns */
        @media (max-width: 900px) {
            .blog-container {
                padding: 25px 15px;
            }

            .blog-header {
                margin-bottom: 35px;
            }

            .blog-header h1 {
                font-size: 32px;
            }

            .blog-header p {
                font-size: 16px;
            }

            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .blog-card-image {
                height: 160px;
            }
        }

        /* Mobile - 1 column */
        @media (max-width: 600px) {
            .blog-container {
                padding: 20px 15px;
            }

            .blog-header {
                margin-bottom: 30px;
            }

            .blog-header h1 {
                font-size: 28px;
            }

            .blog-header p {
                font-size: 15px;
            }

            .blog-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .blog-card-image {
                height: 200px;
            }

            .blog-card-content {
                padding: 18px;
            }

            .blog-card-title {
                font-size: 17px;
            }

            .read-more-btn {
                width: 100%;
                padding: 10px 20px;
            }
        }
    </style>
</head>
